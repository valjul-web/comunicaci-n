<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los medios de comunicación: ¡conectados con el mundo!</title>
<style>
:root{--ink:#3a2a7a;--sky:#eaf5ff;--sun:#ffc93c;--coral:#ff6b8b;--mint:#2bb594;--card:#fff;--bad:#d94a5a}
@media (prefers-color-scheme:dark){:root{--ink:#efe9ff;--sky:#1b1540;--card:#2a2260}}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font:20px/1.5 "Trebuchet MS",Verdana,sans-serif}
header{background:linear-gradient(90deg,#7b5cff,#2eb6ff);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between}
header b{font-size:1.05rem}#st{background:var(--sun);color:#3a2a7a;border-radius:999px;padding:4px 14px;font-weight:700;white-space:nowrap}
#bar{height:10px;background:#ffffff55}#bar i{display:block;height:100%;width:0;background:var(--coral);transition:width .3s}
nav{display:flex;gap:8px;padding:12px 20px;flex-wrap:wrap}
nav button,.tok,.btn2{font:inherit;cursor:pointer;border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px}
nav button{font-size:.85rem}nav button.on{background:var(--sun);color:#3a2a7a;font-weight:700}
main{max-width:900px;margin:0 auto;padding:8px 20px 100px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:28px 28px 28px 6px;padding:24px 28px;box-shadow:6px 6px 0 var(--ink)}
h2{font-size:1.5rem;margin:0 0 .5em}h3{margin:.8em 0 .3em}p{max-width:64ch}
.tag{display:inline-block;background:var(--coral);color:#fff;border-radius:999px;padding:2px 14px;font-size:.8rem;margin-bottom:10px}
.pic{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:18px;margin:6px 0 14px}
.nf .pic{display:none}.ph{display:none}.nf .ph{display:grid;place-items:center;height:190px;font-size:4.5rem;border-radius:18px;border:3px dashed var(--ink);background:linear-gradient(135deg,#ffe8a8,#cfe9ff);margin:6px 0 14px}
.comu{display:flex;gap:12px;align-items:center;background:var(--sun);color:#3a2a7a;border-radius:20px;padding:10px 16px;margin:14px 0}.comu img{width:64px;height:64px;object-fit:contain}.cm{font-size:2.4rem}
.stage{height:300px;margin:6px 0 12px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#5b46d6,#241a6b);cursor:pointer;overflow:hidden}.stage:empty{display:none}.stage canvas{display:block;width:100%!important;height:100%!important}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tok{font-size:.95rem}.tok.on{background:var(--sun);color:#3a2a7a;font-weight:700;transform:scale(1.06)}.tok:disabled{opacity:1;background:var(--mint);color:#fff;cursor:default}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.bin{border:3px dashed var(--ink);border-radius:20px;padding:10px;min-height:120px;cursor:pointer;text-align:center}.bin:hover,.bin:focus-visible{background:#ffc93c33}.bin div{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fb{min-height:1.6em;font-weight:700}.say2,.say{background:var(--mint);color:#fff;border-radius:16px;padding:10px 16px;margin:12px 0;font-weight:700}
.fi{background:var(--sky);border:3px solid var(--ink);border-radius:20px;padding:14px;margin:10px 0;min-height:120px}.fi .big{font-size:3.4rem;line-height:1}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mc{perspective:600px;height:112px;border:0;background:none;padding:0;cursor:pointer}
.in{display:block;position:relative;height:100%;transform-style:preserve-3d;transition:transform .5s}.up .in{transform:rotateY(180deg)}
.bk,.fr{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;border:3px solid var(--ink);border-radius:14px;font-size:.95rem;padding:4px;color:var(--ink)}
.bk{background:var(--sun);font-size:2.2rem}.fr{background:var(--card);transform:rotateY(180deg)}.mc.ok .fr{background:var(--mint);color:#fff}
.mc:focus-visible{outline:4px solid var(--coral)}
label{display:block;font-weight:700;margin:10px 0}input,textarea{display:block;width:100%;font:inherit;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink)}
.paper{background:#fffdf3;color:#222;border:3px solid #222;padding:14px 20px;margin:12px 0;font-family:Georgia,serif;text-align:center}.paper h3{font-size:1.7rem;margin:0;border-bottom:3px double #222}.paper .em{font-size:4rem}
.q .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{background:var(--mint);color:#fff}.opt.no{background:var(--bad);color:#fff}
.cert{container-type:inline-size;aspect-ratio:3/2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7% 15% 5%;color:#4a3410;background:url(img/certificado.jpg) center/100% 100% no-repeat,linear-gradient(135deg,#fff6d6,#ffe1ef,#dff2ff);border-radius:12px;border:2px solid #c9972b}
.cert h2{font-family:Georgia,serif;font-size:5.2cqw;margin:0;color:#b8741a}.cert p{margin:.25em auto;font-size:2.1cqw;line-height:1.3;max-width:none}.cert .sm{font-size:2.1cqw}
.cert input{max-width:70%;margin:.2em auto;text-align:center;border:0;border-bottom:.4cqw solid #c9972b;border-radius:0;background:transparent;color:#4a3410;font:italic 4.6cqw Georgia,serif;padding:0 8px}
.cert .fm{display:flex;align-items:flex-end;justify-content:space-between;gap:3%;margin:1.5% auto 0;width:52%;font-size:1.5cqw}.cert .fm div{flex:1;border-top:.3cqw solid #4a3410;padding-top:.3em}.cert .fm img{width:8cqw;height:9cqw;object-fit:contain;flex:0 0 auto;margin-top:-1cqw}
ul{padding-left:1.2em;max-width:64ch}li{margin:.3em 0}
.nx{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--ink);display:flex;justify-content:space-between;gap:8px;padding:10px 20px}
.nx button{font:inherit;font-size:1rem;font-weight:700;border:3px solid var(--ink);border-radius:999px;padding:8px 22px;background:var(--sun);color:#3a2a7a;cursor:pointer}.nx button:disabled{opacity:.35;cursor:default}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
@media print{body.pr *{visibility:hidden}body.pr .pm,body.pr .pm *{visibility:visible}body.pr .pm{position:absolute;left:0;top:0;width:100%}}
@media (prefers-reduced-motion:reduce){.in,#bar i{transition:none}.shake{animation:none}}
@media (max-width:560px){body{font-size:18px}.card{padding:18px}.mem{grid-template-columns:repeat(3,1fr)}}
@media print{.cert{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (max-width:560px){.nx{padding:8px;gap:4px}.nx button{padding:8px 10px;font-size:.85rem}}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.esc{height:46px;width:auto;background:#fff;border-radius:12px;padding:3px 6px;flex:0 0 auto}
.inst{display:flex;align-items:center;gap:16px;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 16px;margin:0 0 14px}
.inst img,.cr img{height:96px;width:auto;flex:0 0 auto;background:#fff;border-radius:14px;padding:4px}
.inst b{display:block;font-size:1.15rem}.inst small{font-size:.85rem}
.cr{text-align:center;margin:8px 0}.cr img{height:130px}
@media (max-width:560px){.esc{height:38px}header b{font-size:.9rem}.inst img{height:76px}}
#hb{font:inherit;font-size:1.5rem;line-height:1;background:#ffffff26;color:#fff;border:3px solid #fff;border-radius:12px;padding:4px 12px;cursor:pointer;flex:0 0 auto}
#ov{position:fixed;inset:0;background:#0007;z-index:19}
#dr{position:fixed;left:0;top:0;bottom:0;width:min(360px,90vw);background:var(--card);color:var(--ink);border-right:4px solid var(--ink);z-index:20;overflow:auto;padding:14px 16px 24px}
#dr[hidden],#ov[hidden]{display:none}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem}#dx{font:inherit;background:var(--sun);color:#3a2a7a;border:3px solid var(--ink);border-radius:12px;padding:2px 12px;cursor:pointer}
#dr h3{margin:.9em 0 .2em;font-size:.95rem;color:var(--coral)}
.di{display:block;width:100%;text-align:left;font:inherit;font-size:.9rem;background:transparent;color:var(--ink);border:2px solid transparent;border-radius:12px;padding:6px 10px;cursor:pointer}.di:hover{background:#ffc93c55}.di.on{background:var(--sun);color:#3a2a7a;font-weight:700}
.dv{margin:14px 0;padding-top:10px;border-top:3px dashed var(--ink)}.dv select{width:100%;font:inherit;font-size:.85rem;padding:6px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.ft{font-size:.8rem;opacity:.85}
#cv{position:fixed;right:14px;bottom:82px;width:84px;height:84px;object-fit:contain;display:none;z-index:5;pointer-events:none;filter:drop-shadow(0 4px 6px #0003)}#cv.talk{display:block;animation:bn .5s ease-in-out infinite alternate}@keyframes bn{to{transform:translateY(-10px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){#cv.talk{animation:none}}
@media (max-width:700px){nav#menu{display:none}}

.ic{height:1.45em;width:auto;vertical-align:-.32em;margin:0 .1em}
.comu img.ic{width:auto;height:1.45em;object-fit:contain}
#pe .tok{padding:4px 12px}#pe .tok .ic{height:2.6rem;vertical-align:middle}
.big .ic{height:3.6rem;margin:0}.fr .ic{height:3.2rem;max-width:90%;margin:0;vertical-align:baseline}
.paper .em .ic{height:5rem;margin:0}.ph .ic{height:7rem;margin:0;vertical-align:baseline}
#st .ic{height:1.2em;vertical-align:-.25em}.cert .ic{height:1.3em}.bin b .ic{height:1.6em}
.tok .ic{height:1.5em}.bin div .ic{height:1.5em}
@media (prefers-color-scheme:dark){.ic{filter:drop-shadow(0 0 1.5px #fff)}}
</style>
</head>

<header><span class="hl"><button id="hb" aria-label="Abrir el menú" aria-expanded="false" aria-controls="dr">☰</button><img class="esc" src="img/escudo.png" alt="Escudo de la Universidad de Pamplona" onerror="this.style.display='none'"><b><img class="ic" src="img/s/internet.png" alt=""> Medios de comunicación · con Comu</b></span><span id="st"><img class="ic" src="img/s/estrella.png" alt=""> 0 / 6</span></header>
<div id="bar"><i></i></div>
<nav id="menu" aria-label="Mundos"></nav>
<main id="app" tabindex="-1"></main>

{w:1,t:'¡Bienvenidos al mundo de la comunicación!',h:pic('i1.jpg','Niños se saludan con globos de diálogo y un megáfono',ic('charla','xl'))+'<p><b>¡Hola, pequeños exploradores!</b></p><p>¿Alguna vez has escuchado una noticia en la radio? ¿Has visto tus dibujos animados favoritos en la televisión? ¿Has hablado por teléfono con alguien que está lejos?</p><p>¡Todas estas situaciones tienen algo en común! Los medios de comunicación nos permiten compartir información, transmitir mensajes y mantenernos en contacto con otras personas.</p><p>En esta aventura aprenderemos cuáles son, cómo funcionan y por qué son importantes. ¡Prepárate para descubrirlos!</p>'},

{w:1,t:'1.2 ¿Cuáles son los medios de comunicación?',h:'<p><b>Mira el video</b> y escucha con atención.</p><iframe src="https://www.youtube.com/embed/hxwzsnIuyLs" title="Video introductorio" allowfullscreen loading="lazy" style="width:100%;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:14px"></iframe><h3>Conozcamos algunos medios de comunicación</h3><p>Cada medio tiene características particulares y nos permite recibir o transmitir información de distintas maneras.</p>'+ul([ic('tv')+' <b>La televisión:</b> nos permite ver imágenes, escuchar sonidos y conocer noticias o programas de entretenimiento.',ic('radio')+' <b>La radio:</b> nos permite escuchar noticias, música, entrevistas y diferentes programas.',ic('periodico')+' <b>El periódico:</b> es un medio escrito que contiene noticias e información sobre acontecimientos importantes.',ic('telefono')+' <b>El teléfono:</b> nos permite comunicarnos con otras personas mediante llamadas y mensajes.',ic('carta')+' <b>Las cartas:</b> son mensajes escritos que enviamos a otras personas para compartir información o expresar sentimientos.',ic('internet')+' <b>Internet:</b> es una herramienta que nos permite buscar información, aprender y comunicarnos mediante diferentes servicios.'])},
{w:1,t:'Actividad 1: Explora la órbita',h:'<p><b>Cómo jugar:</b> 1) gira el planeta con el dedo; 2) toca un medio de comunicación (en el planeta o en los botones de abajo); 3) lee o escucha lo que dice. ¡Descubre los 6 y ganarás una estrella '+ic('estrella')+'!</p>',act:orbita},
{w:1,t:'1.3 Exploremos lo aprendido',h:'',act:memory,z:'<h3>Otro reto: ¿Qué medio de comunicación es?</h3><p>Observa cada descripción y selecciona la respuesta correcta.</p>'+link(WW2,'Jugar ¿Qué medio es?')+'<p><small>Se abre en otra ventana; cuando termines, vuelve aquí. Si no abre, ¡sigue con la siguiente pantalla!</small></p>'+'<div class="say2">¡Muy bien! Ahora sabes qué son los medios de comunicación y conoces algunos ejemplos. Recuerda: nos ayudan a compartir información y a mantenernos conectados con el mundo. ¡Continuemos aprendiendo!</div>'},
{w:2,t:'¡Cada medio tiene una forma diferente de comunicar!',h:tip('¡bienvenidos de nuevo, exploradores!')+'<p><b>¡Hola nuevamente!</b> En nuestra primera aventura conocimos algunos medios de comunicación. Ahora aprenderemos que podemos clasificarlos según la manera en que transmiten sus mensajes.</p><p>Algunos utilizan palabras escritas, otros sonidos y algunos combinan imágenes y sonidos. ¡Vamos a descubrirlos!</p>'+'<h3>Actividad</h3><p>Toca el botón. Se abre en otra ventana; cuando termines, vuelve aquí. Si no abre, ¡sigue con la siguiente pantalla!</p>'+link(L2A,'Ir a la actividad')},
{w:2,t:'2.1 Los medios de comunicación escritos',h:pic('l2-escritos.jpg','Niños leen periódico, revista y carta',ic('periodico'))+'<p>Son los que utilizan <b>palabras escritas</b> para transmitir información y comunicar mensajes. Podemos leerlos para conocer noticias, recibir información o compartir nuestros pensamientos.</p>'+ul([ic('periodico')+' <b>El periódico:</b> presenta noticias y acontecimientos importantes.',ic('revista')+' <b>Las revistas:</b> contienen artículos, fotografías e información sobre diferentes temas.',ic('carta')+' <b>Las cartas:</b> permiten enviar mensajes escritos a otras personas.'])+'<div class="say2">Observa: cuando lees una carta que alguien te envió, estás utilizando un medio de comunicación escrito.</div>'+'<h3>Actividad</h3><p>Toca el botón. Se abre en otra ventana; cuando termines, vuelve aquí. Si no abre, ¡sigue con la siguiente pantalla!</p>'+link(L2B,'Ir a la actividad')},
{w:2,t:'2.2 Los medios audiovisuales',h:pic('l2-audiovisuales.jpg','Niños ven televisión, cine y videos',ic('tv'))+'<p>Son los que combinan <b>imágenes y sonidos</b> para transmitir información.</p>'+ul([ic('tv')+' <b>La televisión:</b> presenta noticias, películas, dibujos animados y programas.',ic('cine')+' <b>El cine:</b> nos permite observar películas mediante imágenes y sonidos.',ic('video')+' <b>Los videos:</b> transmiten información a través de imágenes en movimiento y sonidos.'])},
{w:2,t:'2.2 Los medios digitales',h:pic('l2-digitales.jpg','Niños usan videollamada, correo e internet',ic('tableta','xl'))+'<p>Son los que utilizan <b>dispositivos electrónicos y herramientas digitales</b> para compartir información y comunicarnos.</p>'+ul([ic('internet')+' Internet',ic('videollamada')+' Las videollamadas',ic('correo')+' El correo electrónico',ic('mensajes')+' Las plataformas digitales de comunicación'])+'<p>Estos medios nos permiten enviar mensajes, compartir información y comunicarnos con personas que están lejos.</p>'},
{w:2,t:'2.3 Actividad: clasifica los medios',h:'',act:function(b){sorter(b,TIPOS,[ic('lapiz')+' Escritos',ic('cine')+' Audiovisuales',ic('tableta')+' Digitales'],'tipos','Clasifica cada medio de comunicación: los <b>escritos</b> se leen, los <b>audiovisuales</b> se ven y se escuchan, y los <b>digitales</b> usan aparatos electrónicos.')},z:'<h3>Juego interactivo</h3><p>Se abre en otra ventana; cuando termines, vuelve aquí. Si no abre, ¡sigue con la siguiente pantalla!</p>'+link(MOB,'Jugar')+'<div class="say2">¡Excelente trabajo! Ahora conoces los diferentes tipos de medios de comunicación y sabes que cada uno transmite información de una manera particular.</div><p><b>Recuerda:</b></p>'+ul(['Los escritos se leen.','Los audiovisuales se ven y se escuchan.','Los digitales utilizan herramientas tecnológicas.'])+'<p>¡Vamos a nuestra última aventura!</p>'},
{w:3,t:'¡Comunicarnos también es aprender!',h:tip('¡esta es nuestra última aventura!')+'<p><b>¡Bienvenidos a nuestra última lección!</b> Ya conocemos los medios de comunicación y sus diferentes tipos. Ahora descubriremos por qué son tan importantes y cómo podemos utilizarlos correctamente.</p><p>Los medios de comunicación nos ayudan a aprender, informarnos, compartir experiencias y mantenernos cerca de las personas que queremos. ¡Comencemos!</p>'},
{w:3,t:'3.1 ¿Para qué sirven los medios de comunicación?',h:pic('l3-funciones.jpg','Cuatro escenas: informar, educar, entretener y comunicar',ic('megafono','xl'))+'<p>Los medios de comunicación cumplen diferentes funciones:</p>'+ul([ic('megafono2')+' <b>1. Informar:</b> nos permiten conocer noticias y acontecimientos de nuestra comunidad y del mundo. <i>Ejemplo: escuchar las noticias en la radio.</i>',ic('birrete')+' <b>2. Educar:</b> nos ayudan a aprender sobre diferentes temas y descubrir nuevos conocimientos. <i>Ejemplo: observar un video educativo.</i>',ic('globos')+' <b>3. Entretener:</b> nos ofrecen momentos de diversión con programas, películas y música. <i>Ejemplo: ver dibujos animados en la televisión.</i>',ic('mensajes')+' <b>4. Comunicar:</b> nos permiten compartir mensajes y mantenernos en contacto con otras personas. <i>Ejemplo: llamar por teléfono a un familiar.</i>'])},
{w:3,t:'Actividad 4: ¿Para qué sirve cada acción?',h:'',act:function(b){sorter(b,FUN,[ic('megafono2')+' Informar',ic('birrete')+' Educar',ic('globos')+' Entretener',ic('mensajes')+' Comunicar'],'funciones','Cada tarjeta es algo que hacemos con los medios de comunicación. Decide si sirve para <b>informar, educar, entretener o comunicar</b>.')}},
{w:3,t:'3.2 Aprendamos a utilizarlos responsablemente',h:pic('l3-responsable.jpg','Una mamá y su hijo usan la tableta de forma segura',ic('familia','xl'))+'<p>Los medios de comunicación son muy útiles, pero debemos aprender a usarlos de manera responsable. Recordemos estos consejos:</p>'+ul(['Pedir ayuda a un adulto cuando usemos internet.','No compartir información personal con desconocidos.','Respetar a las personas cuando enviamos mensajes.','Evitar creer en toda la información que encontramos sin comprobarla.','Usar los dispositivos con moderación.','Elegir contenidos apropiados para nuestra edad.'])+tip('la comunicación siempre debe ir acompañada de respeto y responsabilidad.')},
{w:3,t:'Actividad 5: ¿Buen uso o mal uso?',h:'',act:function(b){sorter(b,USO,[ic('check')+' Buen uso',ic('equis')+' Mal uso'],'responsable','Lee cada tarjeta y decide si es una forma <b>correcta</b> o <b>incorrecta</b> de usar los medios de comunicación.')}},
{w:3,t:'3.3 ¡Conviértete en un comunicador!',h:'<p><b>¡Es momento de crear!</b> Ahora que conoces los medios de comunicación, demuestra lo aprendido. Imagina que eres un pequeño periodista y debes crear tu propio medio de comunicación: ¡un periódico!</p>'+pic('i4.jpg','Guía de la actividad Mi Pequeño Periódico',ic('periodico')).replace('class="pic"','class="pic" style="max-width:420px;margin-inline:auto"')+'<p>Puedes hacerlo aquí en la pantalla o en una hoja con lápices y colores, como muestra la imagen.</p>',act:diario},
{w:3,t:'3.3 Contemos lo que aprendimos',h:tip('¡mira tu periódico y cuéntame cómo te fue!')+'<p>Responde <b>en voz alta</b> estas preguntas, como si se lo contaras a Comu:</p>'+ul(['¿Qué medio de comunicación creaste?','¿Para qué sirven los periódicos?','¿Qué aprendiste sobre los medios de comunicación?','¿Cuál es el medio de comunicación que más utilizas en tu vida cotidiana?'])},
{w:4,t:'Test final',h:'<p><b>Instrucción:</b> lee cada pregunta y toca la respuesta que creas correcta. Con 6 respuestas correctas de 10 recibes tu certificado '+ic('medalla')+'. ¡Tú puedes! Las preguntas cambian cada vez que lo haces.</p>',act:test},
{w:4,t:'¡Felicitaciones, pequeños comunicadores!',h:tip('¡lo lograste!')+'<p>Has terminado este recorrido por el maravilloso mundo de los medios de comunicación. Ahora sabes qué son, cuáles son sus tipos, para qué sirven y por qué debemos utilizarlos responsablemente.</p><p>Recuerda que comunicar es compartir, aprender, informar y expresar nuestras ideas con respeto.</p><div class="say2">¡Sigue explorando, aprendiendo y comunicándote con el mundo!</div><h3>Más juegos</h3>'+link(WW1,'Wordwall')+link(MOB,'Juego interactivo')+'<h3>Créditos</h3><div class="cr"><img src="img/escudo.png" alt="Escudo de la Universidad de Pamplona" onerror="this.style.display=\'none\'"></div><p>Creadoras del OVA:<br><b>Xiomara Valentina Acosta Sánchez</b><br><b>Juliana Paola Rojas Vargas</b></p><p>Asesorado y guiado por la <b>Mag. María Marcela Rivera Corredor</b></p>'}];

/* ===== Motor ===== */
function render(){stopSpeak();var p=P[cur];app=$('#app');app.innerHTML='<article class="card"><span class="tag">'+W[p.w]+'</span><h2>'+p.t+'</h2>'+p.h+'<div id="act"></div>'+(p.z||'')+'</article>';
 if(p.act)p.act($('#act'));$('#bar i').style.width=Math.round((cur+1)*100/P.length)+'%';
 $('#prev').disabled=cur===0;$('#next').disabled=cur===P.length-1;
 [].forEach.call($('#menu').children,function(b,i){b.className=i===p.w?'on':''});S('cmi.core.lesson_location',cur);VIS[cur]=1;buildMenu();app.focus();scrollTo(0,0)}
var app;W.forEach(function(n,i){var b=document.createElement('button');b.textContent=n;b.onclick=function(){cur=P.findIndex(function(p){return p.w===i});render()};$('#menu').appendChild(b)});
$('#prev').onclick=function(){cur--;render()};$('#next').onclick=function(){cur++;render()};
$('#say').onclick=function(){stopSpeak();var a=new Audio('audio/s'+cur+'.mp3');AU=a;a.onplaying=function(){cv(1)};a.onended=function(){cv(0)};a.onerror=function(){if(AU===a){AU=null;speak(leer())}};a.play().catch(function(){if(AU===a){AU=null;speak(leer())}})};$('#stop').onclick=stopSpeak;
var VIS={};
function buildMenu(){var h='',w=-1;P.forEach(function(p,i){if(p.w!==w){w=p.w;h+='<h3>'+W[w]+'</h3>'}h+='<button class="di'+(i===cur?' on':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="page"':'')+'>'+(VIS[i]&&i!==cur?'✓ ':'')+p.t+'</button>'});$('#dl').innerHTML=h;
 [].forEach.call($('#dl').querySelectorAll('.di'),function(b){b.onclick=function(){cur=+b.getAttribute('data-i');closeMenu();render()}})}
function openMenu(){$('#dr').hidden=false;$('#ov').hidden=false;$('#hb').setAttribute('aria-expanded','true');var c=$('#dl .on');(c||$('#dx')).focus();if(c&&c.scrollIntoView)c.scrollIntoView({block:'center'})}
function closeMenu(){$('#dr').hidden=true;$('#ov').hidden=true;$('#hb').setAttribute('aria-expanded','false');$('#hb').focus()}
$('#hb').onclick=function(){$('#dr').hidden?openMenu():closeMenu()};$('#dx').onclick=closeMenu;$('#ov').onclick=closeMenu;
$('#vs').onchange=function(){var k=+this.value;VU=k>=0;VZ=VU?VL[k]:(VL[0]||null);speak('¡Hola! Soy Comu, tu amigo loro.')};
addEventListener('keydown',function(e){var t=e.target&&e.target.tagName;if(e.ctrlKey||e.altKey||e.metaKey)return;
 if(e.key==='Escape'){if(!$('#dr').hidden){closeMenu();e.preventDefault()}else stopSpeak();return}
 if(/INPUT|TEXTAREA|SELECT/.test(t)||!$('#dr').hidden)return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){if(cur<P.length-1){cur++;render()}e.preventDefault()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){if(cur>0){cur--;render()}e.preventDefault()}});
render();
</script>
