{w:0,t:'Los medios de comunicación: ¡conectados con el mundo!',h:'<div class="inst"><img src="img/escudo.png" alt="Escudo de la Universidad de Pamplona" onerror="this.style.display=\'none\'"><span><b>Universidad de Pamplona</b><small>Objeto Virtual de Aprendizaje · Segundo grado</small></span></div>'+tip('¡Hola! Soy Comu, tu amigo loro. Te acompaño en esta aventura.')+'<p>Este Objeto Virtual de Aprendizaje es para estudiantes de segundo grado. Aprenderás qué son los medios de comunicación, cuáles son sus tipos y por qué son importantes en la vida de todos los días, con explicaciones sencillas, imágenes, juegos y actividades creativas.</p><p><b>⏱️ Duración:</b> 3 sesiones de 20 minutos (60 minutos en total).</p><p><b>Tu recorrido:</b></p>'+ul(['Lección 1. Descubramos los medios de comunicación','Lección 2. Conozcamos los tipos de medios de comunicación','Lección 3. La importancia de los medios de comunicación','Cierre y certificado'])+'<p><small>Creado por <b>Xiomara Valentina Acosta Sánchez</b> y <b>Juliana Paola Rojas Vargas</b>.</small></p>'},

{w:1,t:'¡Bienvenidos al mundo de la comunicación!',h:pic('i1.jpg','Niños se saludan con globos de diálogo y un megáfono','🗣️')+'<p><b>¡Hola, pequeños exploradores!</b></p><p>¿Alguna vez has escuchado una noticia en la radio? ¿Has visto tus dibujos animados favoritos en la televisión? ¿Has hablado por teléfono con alguien que está lejos?</p><p>¡Todas estas situaciones tienen algo en común! Los medios de comunicación nos permiten compartir información, transmitir mensajes y mantenernos en contacto con otras personas.</p><p>En esta aventura aprenderemos cuáles son, cómo funcionan y por qué son importantes. ¡Prepárate para descubrirlos!</p>'},
{w:1,t:'1.1 ¿Qué son los medios de comunicación?',h:pic('i2.jpg','Niños usan periódico, televisión, radio, celular y tableta','📺')+'<p>Los medios de comunicación son <b>herramientas</b> que utilizamos para transmitir información, compartir ideas, expresar sentimientos y comunicarnos con otras personas.</p><p>Gracias a ellos podemos conocer noticias, aprender cosas nuevas, escuchar música y saber lo que sucede en diferentes lugares.</p><div class="say2">En palabras más sencillas… los medios de comunicación nos ayudan a enviar y recibir mensajes.</div><p><b>Ejemplos:</b></p>'+ul(['📺 La televisión','📻 La radio','📞 El teléfono','📰 El periódico','✉️ Las cartas','🌐 Internet'])},
{w:1,t:'1.1 ¿Por qué son importantes?',h:pic('i3.jpg','Una familia escucha la radio y un niño llama por celular','📻')+'<p>Los medios de comunicación hacen parte de nuestra vida cotidiana porque nos permiten:</p>'+ul(['Informarnos sobre lo que sucede.','Comunicarnos con familiares y amigos.','Aprender cosas nuevas.','Entretenernos con programas, música y videos.','Compartir mensajes e ideas.'])+'<p><b>Observa estos ejemplos:</b></p>'+ul(['👨‍👩‍👧 Una familia escucha las noticias en la radio.','📞 Un niño llama a su abuela por teléfono.','📰 Una niña lee una noticia en el periódico.'])+'<p>En todos estos casos se están utilizando medios de comunicación.</p>'+tip('¿ya sabes cuáles usas tú en casa?')+'<h3>🎮 Actividad recreativa: juego contra el tiempo</h3><p>Toca el botón. Se abre en otra ventana; cuando termines, vuelve aquí. Si no abre, ¡sigue con la siguiente pantalla!</p>'+link(WW1,'▶️ Jugar contra el tiempo')},

{w:2,t:'¡Cada medio tiene una forma diferente de comunicar!',h:tip('¡bienvenidos de nuevo, exploradores!')+'<p><b>¡Hola nuevamente!</b> En nuestra primera aventura conocimos algunos medios de comunicación. Ahora aprenderemos que podemos clasificarlos según la manera en que transmiten sus mensajes.</p><p>Algunos utilizan palabras escritas, otros sonidos y algunos combinan imágenes y sonidos. ¡Vamos a descubrirlos!</p>'+'<h3>🎮 Actividad</h3><p>Toca el botón. Se abre en otra ventana; cuando termines, vuelve aquí. Si no abre, ¡sigue con la siguiente pantalla!</p>'+link(L2A,'▶️ Ir a la actividad')},
{w:2,t:'2.1 Los medios de comunicación escritos',h:pic('l2-escritos.jpg','Niños leen periódico, revista y carta','📰')+'<p>Son los que utilizan <b>palabras escritas</b> para transmitir información y comunicar mensajes. Podemos leerlos para conocer noticias, recibir información o compartir nuestros pensamientos.</p>'+ul(['📰 <b>El periódico:</b> presenta noticias y acontecimientos importantes.','📖 <b>Las revistas:</b> contienen artículos, fotografías e información sobre diferentes temas.','✉️ <b>Las cartas:</b> permiten enviar mensajes escritos a otras personas.'])+'<div class="say2">👀 Observa: cuando lees una carta que alguien te envió, estás utilizando un medio de comunicación escrito.</div>'+'<h3>🎮 Actividad</h3><p>Toca el botón. Se abre en otra ventana; cuando termines, vuelve aquí. Si no abre, ¡sigue con la siguiente pantalla!</p>'+link(L2B,'▶️ Ir a la actividad')},
{w:2,t:'2.2 Los medios audiovisuales',h:pic('l2-audiovisuales.jpg','Niños ven televisión, cine y videos','📺')+'<p>Son los que combinan <b>imágenes y sonidos</b> para transmitir información.</p>'+ul(['📺 <b>La televisión:</b> presenta noticias, películas, dibujos animados y programas.','🎬 <b>El cine:</b> nos permite observar películas mediante imágenes y sonidos.','▶️ <b>Los videos:</b> transmiten información a través de imágenes en movimiento y sonidos.'])},
{w:2,t:'2.2 Los medios digitales',h:pic('l2-digitales.jpg','Niños usan videollamada, correo e internet','💻')+'<p>Son los que utilizan <b>dispositivos electrónicos y herramientas digitales</b> para compartir información y comunicarnos.</p>'+ul(['🌐 Internet','📹 Las videollamadas','📧 El correo electrónico','💬 Las plataformas digitales de comunicación'])+'<p>Estos medios nos permiten enviar mensajes, compartir información y comunicarnos con personas que están lejos.</p>'},
{w:2,t:'2.3 Actividad: clasifica los medios',h:'',act:function(b){sorter(b,TIPOS,['📝 Escritos','🎬 Audiovisuales','💻 Digitales'],'tipos','Clasifica cada medio de comunicación: los <b>escritos</b> se leen, los <b>audiovisuales</b> se ven y se escuchan, y los <b>digitales</b> usan aparatos electrónicos.')},z:'<h3>🎮 Juego interactivo</h3><p>Se abre en otra ventana; cuando termines, vuelve aquí. Si no abre, ¡sigue con la siguiente pantalla!</p>'+link(MOB,'▶️ Jugar')+'<div class="say2">¡Excelente trabajo! Ahora conoces los diferentes tipos de medios de comunicación y sabes que cada uno transmite información de una manera particular.</div><p><b>Recuerda:</b></p>'+ul(['Los escritos se leen.','Los audiovisuales se ven y se escuchan.','Los digitales utilizan herramientas tecnológicas.'])+'<p>¡Vamos a nuestra última aventura!</p>'},
{w:3,t:'¡Comunicarnos también es aprender!',h:tip('¡esta es nuestra última aventura!')+'<p><b>¡Bienvenidos a nuestra última lección!</b> Ya conocemos los medios de comunicación y sus diferentes tipos. Ahora descubriremos por qué son tan importantes y cómo podemos utilizarlos correctamente.</p><p>Los medios de comunicación nos ayudan a aprender, informarnos, compartir experiencias y mantenernos cerca de las personas que queremos. ¡Comencemos!</p>'},
{w:3,t:'3.1 ¿Para qué sirven los medios de comunicación?',h:pic('l3-funciones.jpg','Cuatro escenas: informar, educar, entretener y comunicar','🎯')+'<p>Los medios de comunicación cumplen diferentes funciones:</p>'+ul(['📢 <b>1. Informar:</b> nos permiten conocer noticias y acontecimientos de nuestra comunidad y del mundo. <i>Ejemplo: escuchar las noticias en la radio.</i>','🎓 <b>2. Educar:</b> nos ayudan a aprender sobre diferentes temas y descubrir nuevos conocimientos. <i>Ejemplo: observar un video educativo.</i>','🎉 <b>3. Entretener:</b> nos ofrecen momentos de diversión con programas, películas y música. <i>Ejemplo: ver dibujos animados en la televisión.</i>','💬 <b>4. Comunicar:</b> nos permiten compartir mensajes y mantenernos en contacto con otras personas. <i>Ejemplo: llamar por teléfono a un familiar.</i>'])},
{w:3,t:'Actividad 4: ¿Para qué sirve cada acción?',h:'',act:function(b){sorter(b,FUN,['📢 Informar','🎓 Educar','🎉 Entretener','💬 Comunicar'],'funciones','Cada tarjeta es algo que hacemos con los medios de comunicación. Decide si sirve para <b>informar, educar, entretener o comunicar</b>.')}},
{w:3,t:'3.2 Aprendamos a utilizarlos responsablemente',h:pic('l3-responsable.jpg','Una mamá y su hijo usan la tableta de forma segura','🛡️')+'<p>Los medios de comunicación son muy útiles, pero debemos aprender a usarlos de manera responsable. Recordemos estos consejos:</p>'+ul(['Pedir ayuda a un adulto cuando usemos internet.','No compartir información personal con desconocidos.','Respetar a las personas cuando enviamos mensajes.','Evitar creer en toda la información que encontramos sin comprobarla.','Usar los dispositivos con moderación.','Elegir contenidos apropiados para nuestra edad.'])+tip('la comunicación siempre debe ir acompañada de respeto y responsabilidad.')},
{w:3,t:'Actividad 5: ¿Buen uso o mal uso?',h:'',act:function(b){sorter(b,USO,['✅ Buen uso','❌ Mal uso'],'responsable','Lee cada tarjeta y decide si es una forma <b>correcta</b> o <b>incorrecta</b> de usar los medios de comunicación.')}},
{w:3,t:'3.3 ¡Conviértete en un comunicador!',h:'<p><b>¡Es momento de crear!</b> Ahora que conoces los medios de comunicación, demuestra lo aprendido. Imagina que eres un pequeño periodista y debes crear tu propio medio de comunicación: ¡un periódico!</p>'+pic('i4.jpg','Guía de la actividad Mi Pequeño Periódico','📰').replace('class="pic"','class="pic" style="max-width:420px;margin-inline:auto"')+'<p>💡 Puedes hacerlo aquí en la pantalla o en una hoja con lápices y colores, como muestra la imagen.</p>',act:diario},
{w:3,t:'3.3 Contemos lo que aprendimos',h:tip('¡mira tu periódico y cuéntame cómo te fue!')+'<p>Responde <b>en voz alta</b> estas preguntas, como si se lo contaras a Comu:</p>'+ul(['🗣️ ¿Qué medio de comunicación creaste?','🗣️ ¿Para qué sirven los periódicos?','🗣️ ¿Qué aprendiste sobre los medios de comunicación?','🗣️ ¿Cuál es el medio de comunicación que más utilizas en tu vida cotidiana?'])},
{w:4,t:'Test final',h:'<p><b>Instrucción:</b> lee cada pregunta y toca la respuesta que creas correcta. Con 6 respuestas correctas de 10 recibes tu certificado 🏅. ¡Tú puedes! Las preguntas cambian cada vez que lo haces.</p>',act:test},
{w:4,t:'¡Felicitaciones, pequeños comunicadores!',h:tip('¡lo lograste!')+'<p>Has terminado este recorrido por el maravilloso mundo de los medios de comunicación. Ahora sabes qué son, cuáles son sus tipos, para qué sirven y por qué debemos utilizarlos responsablemente.</p><p>Recuerda que comunicar es compartir, aprender, informar y expresar nuestras ideas con respeto.</p><div class="say2">¡Sigue explorando, aprendiendo y comunicándote con el mundo!</div><h3>Más juegos</h3>'+link(WW1,'Wordwall')+link(MOB,'Juego interactivo')+'<h3>Créditos</h3><div class="cr"><img src="img/escudo.png" alt="Escudo de la Universidad de Pamplona" onerror="this.style.display=\'none\'"></div><p>Creadoras del OVA:<br><b>Xiomara Valentina Acosta Sánchez</b><br><b>Juliana Paola Rojas Vargas</b></p><p>Asesorado y guiado por la <b>Mag. María Marcela Rivera Corredor</b></p>'}];

/* ===== Motor ===== */
function render(){stopSpeak();var p=P[cur];app=$('#app');app.innerHTML='<article class="card"><span class="tag">'+W[p.w]+'</span><h2>'+p.t+'</h2>'+p.h+'<div id="act"></div>'+(p.z||'')+'</article>';
 if(p.act)p.act($('#act'));$('#bar i').style.width=Math.round((cur+1)*100/P.length)+'%';
 $('#prev').disabled=cur===0;$('#next').disabled=cur===P.length-1;
 [].forEach.call($('#menu').children,function(b,i){b.className=i===p.w?'on':''});S('cmi.core.lesson_location',cur);VIS[cur]=1;buildMenu();app.focus();scrollTo(0,0)}
var app;W.forEach(function(n,i){var b=document.createElement('button');b.textContent=n;b.onclick=function(){cur=P.findIndex(function(p){return p.w===i});render()};$('#menu').appendChild(b)});
$('#prev').onclick=function(){cur--;render()};$('#next').onclick=function(){cur++;render()};
$('#say').onclick=function(){stopSpeak();var a=new Audio('audio/s'+cur+'.mp3');AU=a;a.onplaying=function(){cv(1)};a.onended=function(){cv(0)};a.onerror=function(){if(AU===a){AU=null;speak(leer())}};a.play().catch(function(){if(AU===a){AU=null;speak(leer())}})};$('#stop').onclick=stopSpeak;
var VIS={};
function buildMenu(){var h='',w=-1;P.forEach(function(p,i){if(p.w!==w){w=p.w;h+='<h3>'+W[w]+'</h3>'}h+='<button class="di'+(i===cur?' on':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="page"':'')+'>'+(VIS[i]&&i!==cur?'✓ ':'')+p.t+'</button>'});$('#dl').innerHTML=h;
 [].forEach.call($('#dl').querySelectorAll('.di'),function(b){b.onclick=function(){cur=+b.getAttribute('data-i');closeMenu();render()}})}
function openMenu(){$('#dr').hidden=false;$('#ov').hidden=false;$('#hb').setAttribute('aria-expanded','true');var c=$('#dl .on');(c||$('#dx')).focus();if(c&&c.scrollIntoView)c.scrollIntoView({block:'center'})}
function closeMenu(){$('#dr').hidden=true;$('#ov').hidden=true;$('#hb').setAttribute('aria-expanded','false');$('#hb').focus()}
$('#hb').onclick=function(){$('#dr').hidden?openMenu():closeMenu()};$('#dx').onclick=closeMenu;$('#ov').onclick=closeMenu;
$('#vs').onchange=function(){var k=+this.value;VU=k>=0;VZ=VU?VL[k]:(VL[0]||null);speak('¡Hola! Soy Comu, tu amigo loro.')};
addEventListener('keydown',function(e){var t=e.target&&e.target.tagName;if(e.ctrlKey||e.altKey||e.metaKey)return;
 if(e.key==='Escape'){if(!$('#dr').hidden){closeMenu();e.preventDefault()}else stopSpeak();return}
 if(/INPUT|TEXTAREA|SELECT/.test(t)||!$('#dr').hidden)return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){if(cur<P.length-1){cur++;render()}e.preventDefault()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){if(cur>0){cur--;render()}e.preventDefault()}});
render();
